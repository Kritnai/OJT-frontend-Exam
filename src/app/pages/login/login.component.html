<div class="login-wrapper">
  <div class="login-header">
    <div class="logo">
      <svg width="60" height="60" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="20" fill="#2f68f5" />
        <g transform="translate(8, 8) scale(1)">
          <path
            d="M9.002 2.5a.75.75 0 0 1 .691.464l6.302 15.305 2.56-6.301a.75.75 0 0 1 .695-.468h4a.75.75 0 0 1 0 1.5h-3.495l-3.06 7.532a.75.75 0 0 1-1.389.004L8.997 5.21l-3.054 7.329A.75.75 0 0 1 5.25 13H.75a.75.75 0 0 1 0-1.5h4l3.558-8.538a.75.75 0 0 1 .694-.462Z"
            fill="white" />
        </g>
      </svg>
    </div>
    <h1 class="title">ระบบจัดการประวัติคนไข้</h1>
    <p class="subtitle">กรุณาเข้าสู่ระบบเพื่อดำเนินการต่อ</p>
  </div>

  <div class="login-card">
    <form nz-form [formGroup]="loginForm" (ngSubmit)="submitForm()" nzLayout="vertical">
      <nz-form-item>
        <nz-form-label>Email</nz-form-label>
        <nz-form-control nzErrorTip="กรุณากรอกอีเมลให้ถูกต้อง">
          <nz-input-group [nzPrefix]="prefixEmail">
            <input nz-input formControlName="email" placeholder="Email" type="email" />
          </nz-input-group>
          <ng-template #prefixEmail>
            <span nz-icon nzType="mail" nzTheme="outline" class="input-icon"></span>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <nz-form-item>
        <nz-form-label>Password</nz-form-label>
        <nz-form-control nzErrorTip="กรุณากรอกรหัสผ่าน">
          <nz-input-group [nzPrefix]="prefixPassword">
            <input nz-input formControlName="password" placeholder="Password" type="password" />
          </nz-input-group>
          <ng-template #prefixPassword>
            <span nz-icon nzType="lock" nzTheme="outline" class="input-icon"></span>
          </ng-template>
        </nz-form-control>
      </nz-form-item>

      <div nz-row class="login-form-margin">
        <div nz-col [nzSpan]="24">
          <button nz-button nzType="primary" [nzSize]="'large'" nzBlock class="login-btn" [nzLoading]="isLoading">
            เข้าสู่ระบบ
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
